name: Bug report
description: Something behaves wrong in the game or the sim
labels: ["bug"]
body:
  - type: input
    id: seed
    attributes:
      label: Seed
      description: >
        The run is deterministic, so a seed usually reproduces the bug exactly.
        The browser shows it in the URL (?seed=7); the harness takes --seed.
      placeholder: "7"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Prefer a headless repro: `npm run sim -- trace --seed 7 --every 2` prints a
        second-by-second readout, and its `moved` column has caught several bugs.
      placeholder: |
        npm run sim -- trace --seed 7 --every 2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [sim, render, ui, session, net, harness, build, unsure]
    validations:
      required: true
